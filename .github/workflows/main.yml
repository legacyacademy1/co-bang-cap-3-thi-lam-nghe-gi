
name: Deploy website to Surge

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy website
        run: npx --yes surge@latest . top10hcm.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
